<!DOCTYPE html>
<html>

<head>
    <title>Create User</title>
</head>

<body>

    <h1>Create User</h1>

    <form action="/create_user" method="POST">

        <label>Username:</label>
        <input type="text" name="username">

        <br><br>

        <label>Email:</label>
        <input type="email" name="email">

        <br><br>

        <label>Password:</label>
        <input type="password" name="password">

        <br><br>

        <button type="submit">
            Create User
        </button>

    </form>

</body>

</html>
