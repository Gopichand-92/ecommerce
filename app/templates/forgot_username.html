<!DOCTYPE html>
<html>

<head>

    <title>Forgot Username</title>

    <style>

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-image: url("{{ url_for('static', filename='bg.jpg') }}");
            background-size: cover;
            background-position: center;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #0b2545;
            text-align: center;
            justify-content: center;
            margin: 30px;
            font-weight: 500;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .row label {
            width: 120px;
            text-align: right;
            font-size: 18px;
            color: #005683;
            font-weight: 600;
            margin-right: 15px;
        }

        .row input {
            width: 300px;
            height: 35px;
            box-sizing: border-box;
            border: none;
            border-radius: 5px;
        }

        button {
            background-color: #005683;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: white;
            color: #005683;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Forgot Username</h1>

        <form action="/forgot_username/check" method="GET">

            <div class="row">

                <label>Email:</label>

                <input
                    type="email"
                    name="Email"
                    value="{{ email }}"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="row">

                <label>User Name:</label>

                <input
                    type="text"
                    name="Username"
                    value="{{ username }}"
                >

            </div>

            <button type="submit">
                Find Username
            </button>

        </form>

        <br>

        <a href="/">
            Back to Login
        </a>

    </div>

</body>

</html>
