<!doctype html>
<html>
  <head>
    <script>
      async function loadUsers() {
        try {
          const response = await fetch("http://127.0.0.1:5000/all_users");
          if (!response.ok) {
            throw new Error(`HTTP error: ${response.status}`);
          }
          const result = await response.json();
          console.log(result);
          const users = result.data;
          const table = document.getElementById("usersTable");
          table.innerHTML = "";
          users.forEach((user) => {
            const row = document.createElement("tr");
            row.innerHTML = ` <td>${user.id}</td> <td>${user.name}</td> <td>${user.email}</td> `;
            table.appendChild(row);
          });
        } catch (error) {
          console.error("Error loading users:", error);
        }
      }
      loadUsers();
    </script>

    <title>Users List</title>
    <style>
      body {
        margin: 0;

        padding: 40px;

        font-family: Arial, sans-serif;

        background-color: #f2f2f2;
      }

      .container {
        width: 80%;

        margin: auto;

        background-color: white;

        padding: 30px;

        border-radius: 10px;

        box-shadow: 0 0 10px gray;
      }

      h1 {
        text-align: center;

        margin-bottom: 30px;
      }

      table {
        width: 100%;

        border-collapse: collapse;
      }

      th {
        background-color: #333;

        color: white;

        padding: 12px;

        border: 1px solid #ddd;
      }

      td {
        padding: 12px;

        text-align: center;

        border: 1px solid #ddd;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      tr:hover {
        background-color: #ddd;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Users List</h1>

      <table>
        <thead>
          <tr>
            <th>Name</th>

            <th>Email</th>

            <th>Phone Number</th>
          </tr>
        </thead>
        <tbody id="usersTable">
        </tbody>
      </table>
    </div>
  </body>
</html>
