<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            color: #222;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #ddd;
            padding: 20px 0;
        }

        .cart-item img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .product-details {
            flex: 1;
        }

        .product-details h3 {
            margin-bottom: 10px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
        }

        .quantity-controls button {
            padding: 7px 13px;
        }

        .quantity-value {
            font-weight: bold;
        }

        .remove-button {
            background: #d32f2f;
            padding: 8px 15px;
        }

        .remove-button:hover {
            background: #b71c1c;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-top: 25px;
            text-align: right;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .checkout-button {
            background: #ffb000;
            color: black;
            font-weight: bold;
        }

        .checkout-button:hover {
            background: #e69e00;
        }

        .message {
            text-align: center;
            padding: 25px;
            color: #555;
        }

        @media (max-width: 600px) {
            .cart-item {
                flex-wrap: wrap;
            }

            .buttons {
                gap: 12px;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>My Shopping Cart</h2>

    <div id="cartProducts">
        Loading cart items...
    </div>

    <div class="total">
        Total Amount: ₹<span id="totalAmount">0.00</span>
    </div>

    <div class="buttons">

        <button onclick="window.location.href='/search_products_page'">
            Continue Shopping
        </button>

        <button
            id="checkoutButton"
            class="checkout-button"
            onclick="window.location.href='/checkout/2'">
            Proceed to Buy
        </button>

    </div>

</div>

<script>

    // Current test user ID
    const userId = 2;


    // ==========================================
    // LOAD CART ITEMS
    // ==========================================

    async function loadCart() {

        try {

            const response = await fetch(`/get_cart/${userId}`);
            const data = await response.json();

            const cartProducts = document.getElementById("cartProducts");
            const checkoutButton = document.getElementById("checkoutButton");

            if (!response.ok) {
                throw new Error(data.error || "Unable to load cart");
            }

            if (!data.cart || data.cart.length === 0) {

                cartProducts.innerHTML =
                    '<div class="message">Your Cart is Empty</div>';

                document.getElementById("totalAmount").textContent = "0.00";

                checkoutButton.disabled = true;

                return;
            }

            checkoutButton.disabled = false;
            cartProducts.innerHTML = "";

            let totalAmount = 0;

            data.cart.forEach(product => {

                const productDiv = document.createElement("div");
                productDiv.className = "cart-item";

                // Product image
                const image = document.createElement("img");
                image.src = product.product_image;
                image.alt = product.product_name;

                // Product details
                const details = document.createElement("div");
                details.className = "product-details";

                const name = document.createElement("h3");
                name.textContent = product.product_name;

                const price = document.createElement("p");
                price.textContent = `Price: ₹${product.product_price}`;

                // Quantity controls
                const quantityControls = document.createElement("div");
                quantityControls.className = "quantity-controls";

                const decreaseButton = document.createElement("button");
                decreaseButton.textContent = "-";
                decreaseButton.disabled = Number(product.quantity) <= 1;

                decreaseButton.onclick = () => {
                    updateQuantity(
                        product.cart_item_id,
                        Number(product.quantity) - 1
                    );
                };

                const quantityValue = document.createElement("span");
                quantityValue.className = "quantity-value";
                quantityValue.textContent = product.quantity;

                const increaseButton = document.createElement("button");
                increaseButton.textContent = "+";

                increaseButton.onclick = () => {
                    updateQuantity(
                        product.cart_item_id,
                        Number(product.quantity) + 1
                    );
                };

                quantityControls.append(
                    decreaseButton,
                    quantityValue,
                    increaseButton
                );

                // Product subtotal
                const subtotal =
                    Number(product.product_price) * Number(product.quantity);

                const itemTotal = document.createElement("p");
                itemTotal.textContent = `Subtotal: ₹${subtotal.toFixed(2)}`;

                totalAmount += subtotal;

                // Remove button
                const removeButton = document.createElement("button");
                removeButton.className = "remove-button";
                removeButton.textContent = "Remove";

                removeButton.onclick = () => {
                    removeCartItem(product.cart_item_id);
                };

                details.append(
                    name,
                    price,
                    quantityControls,
                    itemTotal,
                    removeButton
                );

                productDiv.append(image, details);

                cartProducts.appendChild(productDiv);

            });

            // Update total amount
            document.getElementById("totalAmount").textContent =
                totalAmount.toFixed(2);

        }
        catch (error) {

            document.getElementById("cartProducts").textContent =
                "Unable to load cart items.";

            document.getElementById("checkoutButton").disabled = true;

            console.error(error);
        }
    }


    // ==========================================
    // INCREASE / DECREASE QUANTITY
    // ==========================================

    async function updateQuantity(cartItemId, newQuantity) {

        if (newQuantity < 1) {
            return;
        }

        try {

            const response = await fetch(
                `/update_cart/${userId}/${cartItemId}`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        quantity: newQuantity
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Unable to update quantity");
            }

            // Reload cart and recalculate total
            await loadCart();

        }
        catch (error) {

            alert(error.message);
            console.error(error);
        }
    }


    // ==========================================
    // REMOVE PRODUCT FROM CART
    // ==========================================

    async function removeCartItem(cartItemId) {

        if (!confirm("Are you sure you want to remove this product?")) {
            return;
        }

        try {

            const response = await fetch(
                `/remove_cart/${userId}/${cartItemId}`,
                {
                    method: "DELETE"
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Unable to remove product");
            }

            // Reload cart and recalculate total
            await loadCart();

        }
        catch (error) {

            alert(error.message);
            console.error(error);
        }
    }


    // ==========================================
    // LOAD CART WHEN PAGE OPENS
    // ==========================================

    loadCart();

</script>

</body>
</html>
