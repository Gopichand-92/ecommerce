
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | Premium Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101010;
            color: #f5f5f5;
            padding: 25px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px 0 25px;
            border-bottom: 1px solid #37302a;
            margin-bottom: 30px;
        }

        header h2 {
            color: #d4af37;
        }

        .back-btn {
            color: #d4af37;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .product-card {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 35px;
            background: #1a1a1a;
            border: 1px solid #383027;
            border-radius: 15px;
            padding: 25px;
        }

        .product-image {
            width: 100%;
            height: 350px;
            object-fit: contain;
            background: #fff;
            border-radius: 10px;
        }

        .product-info h1 {
            color: #d4af37;
            margin-bottom: 15px;
        }

        .price {
            font-size: 27px;
            font-weight: bold;
            margin: 15px 0;
        }

        .description {
            color: #ccc;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .cart-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
            max-width: 350px;
        }

        .cart-controls label {
            color: #ccc;
        }

        .cart-controls select {
            width: 100%;
            padding: 12px;
            background: #242424;
            color: white;
            border: 1px solid #888;
            border-radius: 8px;
            font-size: 16px;
        }

        .cart-controls button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-controls button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .add-cart-btn {
            background: #ffcc00;
        }

        .add-cart-btn:hover {
            background: #f2bd00;
        }

        .buy-now-btn {
            background: #ff9900;
        }

        .buy-now-btn:hover {
            background: #ee8800;
        }

        .cart-message {
            margin-top: 10px;
            line-height: 1.5;
            color: #8fdb9a;
            overflow-wrap: anywhere;
        }

        .section {
            margin-top: 30px;
        }

        .section h2 {
            color: #d4af37;
            font-size: 21px;
            margin-bottom: 15px;
        }

        .color-list,
        .offer-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .color-item,
        .offer-item {
            background: #242424;
            border: 1px solid #51442b;
            border-radius: 8px;
            padding: 12px 15px;
        }

        .offer-item {
            flex: 1 1 220px;
        }

        .offer-item h3 {
            color: #e5c45b;
            margin-bottom: 10px;
        }

        .discount {
            color: #8fdb9a;
            margin-top: 8px;
        }

        .offer-count {
            display: inline-block;
            color: #e5c45b;
            background: #242424;
            border: 1px solid #51442b;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .status {
            color: #ccc;
            margin: 25px 0;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .product-card {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            .product-image {
                height: 260px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>PREMIUM SHOPPING</h2>

        <a class="back-btn" href="/search_products_page">
            ← Back to Products
        </a>
    </header>

    <main class="container">

        <p id="status" class="status">Loading product details...</p>

        <div id="productDetails"></div>

        <section class="section">
            <h2>Available Colors</h2>

            <p id="colorCount">Loading colors...</p>

            <div id="colorList" class="color-list"></div>
        </section>

        <section class="section">
            <h2>Available Offers</h2>

            <p id="offerCount" class="offer-count">
                Total Offers: Loading...
            </p>

            <div id="offerList" class="offer-list"></div>
        </section>

    </main>

    <script>

        // Get product ID from the URL
        const productId = new URLSearchParams(
            window.location.search
        ).get("product_id");

        // Current testing user ID
        const userId = 2;

        // Get HTML elements
        const productDetails = document.getElementById("productDetails");
        const statusElement = document.getElementById("status");
        const colorCount = document.getElementById("colorCount");
        const colorList = document.getElementById("colorList");
        const offerCount = document.getElementById("offerCount");
        const offerList = document.getElementById("offerList");


        // Escape HTML values before displaying API data
        function escapeHtml(value) {

            return String(value ?? "").replace(/[&<>"']/g, function(char) {

                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                }[char];

            });
        }


        // Format product prices
        function formatPrice(value) {

            const amount = Number(value);

            return Number.isFinite(amount)
                ? "₹" + amount.toLocaleString("en-IN", {
                    maximumFractionDigits: 2
                })
                : "Price unavailable";
        }


        // Display available product offers
        function displayOffers(offers) {

            const allOffers = Array.isArray(offers) ? offers : [];

            offerCount.textContent = "Total Offers: " + allOffers.length;

            if (allOffers.length === 0) {

                offerList.innerHTML =
                    "<p>No offers available for this product.</p>";

                return;
            }

            offerList.innerHTML = allOffers.map(offer => `

                <div class="offer-item">

                    <h3>${escapeHtml(offer.offer_type || "Offer")}</h3>

                    <p>
                        Discount:
                        ${escapeHtml(offer.discount_percentage ?? 0)}%
                    </p>

                    <p class="discount">
                        You save: ${formatPrice(offer.discount_amount)}
                    </p>

                </div>

            `).join("");
        }


        // Add selected product and quantity to cart
        async function addToCart(redirectToCheckout = false) {

            const quantityElement = document.getElementById("quantity");
            const messageElement = document.getElementById("cartMessage");
            const addButton = document.getElementById("addCartButton");
            const buyButton = document.getElementById("buyNowButton");

            const quantity = Number(quantityElement.value);

            if (!Number.isInteger(quantity) || quantity < 1) {

                messageElement.textContent = "Please select a valid quantity.";

                return;
            }

            // Disable buttons while the request is processing
            addButton.disabled = true;
            buyButton.disabled = true;

            addButton.textContent = "Adding...";
            messageElement.textContent = "";

            try {

                // Call the existing Add to Cart API
                const response = await fetch("/add_to_cart", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        user_id: userId,
                        product_id: Number(productId),
                        quantity: quantity

                    })

                });

                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        data.error ||
                        "Failed to add product to cart."
                    );
                }

                // Display success message
                messageElement.textContent =
                    data.message || "Product added to cart successfully.";

                // Redirect based on the clicked button
                if (redirectToCheckout) {

                    window.location.href = `/checkout/${userId}`;

                } else {

                    window.location.href = '/cart';

                }

            } catch (error) {

                messageElement.textContent = error.message;

            } finally {

                addButton.disabled = false;
                buyButton.disabled = false;

                addButton.textContent = "Add to Cart";
            }
        }


        // Buy Now: add product to cart and open checkout
        function buyNow() {

            addToCart(true);

        }


        // Load product details from Flask API
        async function loadProductDetails() {

            if (
                !productId ||
                !Number.isInteger(Number(productId)) ||
                Number(productId) < 1
            ) {

                statusElement.textContent = "Valid product ID is required.";

                offerCount.textContent = "Total Offers: 0";
                offerList.innerHTML = "";

                colorCount.textContent = "Total Colors: 0";
                colorList.innerHTML = "";

                return;
            }

            try {

                // Fetch product details using product ID
                const response = await fetch(
                    `/api/product-details?product_id=${encodeURIComponent(productId)}`
                );

                if (!response.ok) {

                    throw new Error("Product could not be loaded.");

                }

                const product = await response.json();

                if (product.error) {

                    throw new Error(product.error);

                }

                statusElement.textContent = "";

                // Display product information
                productDetails.innerHTML = `

                    <div class="product-card">

                        <div>

                            <img
                                class="product-image"
                                src="${escapeHtml(product.image || "")}"
                                alt="${escapeHtml(product.name || "Product")}"
                                onerror="this.style.display='none'"
                            >

                        </div>

                        <div class="product-info">

                            <h1>${escapeHtml(product.name)}</h1>

                            <p>
                                Category:
                                ${escapeHtml(product.category || "Not specified")}
                            </p>

                            <p class="price">
                                ${formatPrice(product.price)}
                            </p>

                            <p class="description">
                                ${escapeHtml(
                                    product.description ||
                                    "No description available."
                                )}
                            </p>

                            <div class="cart-controls">

                                <label for="quantity">
                                    Quantity:
                                </label>

                                <select id="quantity">

                                    ${Array.from({ length: 10 }, (_, i) =>

                                        `<option value="${i + 1}">
                                            ${i + 1}
                                        </option>`

                                    ).join("")}

                                </select>

                                <button
                                    type="button"
                                    id="addCartButton"
                                    class="add-cart-btn"
                                    onclick="addToCart()"
                                >
                                    Add to Cart
                                </button>

                                <p id="cartMessage" class="cart-message"></p>

                                <button
                                    type="button"
                                    id="buyNowButton"
                                    class="buy-now-btn"
                                    onclick="buyNow()"
                                >
                                    Buy Now
                                </button>

                            </div>

                        </div>

                    </div>

                `;


                // Get product colors from API response
                const colors = Array.isArray(product.colors)
                    ? product.colors
                    : (product.colors?.items || []);

                const colorNames = colors.map(color =>

                    typeof color === "string"
                        ? color
                        : color.color_name

                ).filter(Boolean);


                // Display available colors
                colorCount.textContent =
                    "Total Colors: " + colorNames.length;

                colorList.innerHTML = colorNames.length

                    ? colorNames.map(color => `

                        <div class="color-item">
                            ${escapeHtml(color)}
                        </div>

                    `).join("")

                    : "<p>No colors available.</p>";


                // Display available offers
                displayOffers(product.offers);

            } catch (error) {

                statusElement.textContent = error.message;

                offerCount.textContent = "Total Offers: 0";
                offerList.innerHTML = "";

                colorCount.textContent = "Total Colors: 0";
                colorList.innerHTML = "";

            }
        }


        // Load product details when the page opens
        loadProductDetails();

    </script>

</body>

</html>
