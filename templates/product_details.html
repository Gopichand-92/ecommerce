<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Premium Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101010;
            color: #f5f5f5;
            padding: 25px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px 0 25px;
            border-bottom: 1px solid #37302a;
            margin-bottom: 30px;
        }

        header h2 {
            color: #d4af37;
        }

        .back-btn {
            color: #d4af37;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .product-card {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 35px;
            background: #1a1a1a;
            border: 1px solid #383027;
            border-radius: 15px;
            padding: 25px;
        }

        .product-image {
            width: 100%;
            height: 350px;
            object-fit: contain;
            background: #fff;
            border-radius: 10px;
        }

        .product-info h1 {
            color: #d4af37;
            margin-bottom: 15px;
        }

        .price {
            font-size: 27px;
            font-weight: bold;
            margin: 15px 0;
        }

        .description {
            color: #ccc;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .section {
            margin-top: 30px;
        }

        .section h2 {
            color: #d4af37;
            font-size: 21px;
            margin-bottom: 15px;
        }

        .color-list, .offer-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .color-item, .offer-item {
            background: #242424;
            border: 1px solid #51442b;
            border-radius: 8px;
            padding: 12px 15px;
        }

        .offer-item {
            flex: 1 1 220px;
        }

        .offer-item h3 {
            color: #e5c45b;
            margin-bottom: 10px;
        }

        .discount {
            color: #8fdb9a;
            margin-top: 8px;
        }

        .offer-count {
            display: inline-block;
            color: #e5c45b;
            background: #242424;
            border: 1px solid #51442b;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .status {
            color: #ccc;
            margin: 25px 0;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .product-card {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            .product-image {
                height: 260px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h2>PREMIUM SHOPPING</h2>
        <a class="back-btn" href="/search_products_page">
            ← Back to Products
        </a>
    </header>

    <main class="container">
        <p id="status" class="status">Loading product details...</p>

        <div id="productDetails"></div>

        <section class="section">
            <h2>Available Colors</h2>
            <p id="colorCount">Loading colors...</p>
            <div id="colorList" class="color-list"></div>
        </section>

        <section class="section">
            <h2>Available Offers</h2>
            <p id="offerCount" class="offer-count">
                Total Offers: Loading...
            </p>
            <div id="offerList" class="offer-list"></div>
        </section>
    </main>

    <script>
        const productId = new URLSearchParams(
            window.location.search
        ).get("product_id");

        const productDetails = document.getElementById("productDetails");
        const statusElement = document.getElementById("status");
        const colorCount = document.getElementById("colorCount");
        const colorList = document.getElementById("colorList");
        const offerCount = document.getElementById("offerCount");
        const offerList = document.getElementById("offerList");

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, function(char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                }[char];
            });
        }

        function formatPrice(value) {
            const amount = Number(value);

            return Number.isFinite(amount)
                ? "₹" + amount.toLocaleString("en-IN", {
                    maximumFractionDigits: 2
                })
                : "Price unavailable";
        }

        function displayOffers(offers) {
            const allOffers = Array.isArray(offers) ? offers : [];

            offerCount.textContent =
                "Total Offers: " + allOffers.length;

            if (allOffers.length === 0) {
                offerList.innerHTML =
                    "<p>No offers available for this product.</p>";
                return;
            }

            offerList.innerHTML = allOffers.map(offer => `
                <div class="offer-item">
                    <h3>
                        ${escapeHtml(offer.offer_type || "Offer")}
                    </h3>

                    <p>
                        Discount:
                        ${escapeHtml(offer.discount_percentage ?? 0)}%
                    </p>

                    <p class="discount">
                        You save:
                        ${formatPrice(offer.discount_amount)}
                    </p>
                </div>
            `).join("");
        }

        async function loadProductDetails() {
            if (!productId) {
                statusElement.textContent = "Product ID is missing.";
                offerCount.textContent = "Total Offers: 0";
                offerList.innerHTML = "";
                return;
            }

            try {
                const response = await fetch(
                    `/api/product-details?product_id=${encodeURIComponent(productId)}`
                );

                if (!response.ok) {
                    throw new Error("Product could not be loaded.");
                }

                const product = await response.json();

                if (product.error) {
                    throw new Error(product.error);
                }

                statusElement.textContent = "";

                productDetails.innerHTML = `
                    <div class="product-card">
                        <div>
                            <img
                                class="product-image"
                                src="${escapeHtml(product.image || "")}"
                                alt="${escapeHtml(product.name || "Product")}"
                                onerror="this.style.display='none'"
                            >
                        </div>

                        <div class="product-info">
                            <h1>${escapeHtml(product.name)}</h1>

                            <p>
                                Category:
                                ${escapeHtml(product.category || "Not specified")}
                            </p>

                            <p class="price">
                                ${formatPrice(product.price)}
                            </p>

                            <p class="description">
                                ${escapeHtml(
                                    product.description ||
                                    "No description available."
                                )}
                            </p>
                        </div>
                    </div>
                `;

                // Display all colors.
                const colors = Array.isArray(product.colors)
                    ? product.colors
                    : (product.colors?.items || []);

                const colorNames = colors.map(color =>
                    typeof color === "string"
                        ? color
                        : color.color_name
                ).filter(Boolean);

                colorCount.textContent =
                    "Total Colors: " + colorNames.length;

                colorList.innerHTML = colorNames.length
                    ? colorNames.map(color => `
                        <div class="color-item">
                            ${escapeHtml(color)}
                        </div>
                    `).join("")
                    : "<p>No colors available.</p>";

                // Display the count and details of every offer.
                displayOffers(product.offers);

            } catch (error) {
                statusElement.textContent = error.message;
                offerCount.textContent = "Total Offers: 0";
                offerList.innerHTML = "";
            }
        }

        loadProductDetails();
    </script>
</body>
</html>
